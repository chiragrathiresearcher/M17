# ChiragRathi M17 Framework CI/CD Pipeline
# Continuous Integration and Deployment for M17 Framework
# 
# Features:
# - Multi-platform builds (Linux, macOS, Windows)
# - Comprehensive testing (unit, integration, performance)
# - Code quality checks (linting, formatting, security)
# - Docker image builds and deployment
# - Documentation generation and deployment
# - Release automation
# 
# Author: ChiragRathi
# Version: 2.0.0
# Date: 2026

name: M17 Framework CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily builds at 2 AM UTC
    - cron: '0 2 * * *'

env:
  # Global environment variables
  M17_VERSION: "2.0.0"
  DOCKER_REGISTRY: "ghcr.io"
  DOCKER_IMAGE: "chiragrathiresearcher/m17-framework"

jobs:
  # ==========================================================================
  # Code Quality and Security Checks
  # ==========================================================================
  
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy bandit safety
        
    - name: Run Black (Python formatting)
      run: |
        black --check --diff src/python/ tools/ || exit 1
        
    - name: Run Flake8 (Python linting)
      run: |
        flake8 src/python/ tools/ --max-line-length=100 --ignore=E203,W503
        
    - name: Run MyPy (Python type checking)
      run: |
        mypy src/python/m17/ --ignore-missing-imports
        
    - name: Run Bandit (Python security)
      run: |
        bandit -r src/python/ -f json -o bandit-report.json || true
        
    - name: Check Python dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Set up clang-format for C++
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14
        
    - name: Check C++ formatting
      run: |
        find src/ -name "*.cpp" -o -name "*.hpp" | xargs clang-format-14 --dry-run --Werror
        
    - name: Run cppcheck (C++ static analysis)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --inconclusive --xml --xml-version=2 \
          --output-file=cppcheck-report.xml src/ || true
          
    - name: Upload code quality artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-reports
        path: |
          bandit-report.json
          safety-report.json
          cppcheck-report.xml

  # ==========================================================================
  # Build Matrix: Multiple Platforms and Configurations
  # ==========================================================================
  
  build-matrix:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04, macos-12, windows-2022]
        compiler: [gcc, clang]
        build-type: [Release, Debug]
        exclude:
          # Windows only supports MSVC for this build
          - os: windows-2022
            compiler: gcc
          - os: windows-2022
            compiler: clang
        include:
          # Add MSVC for Windows
          - os: windows-2022
            compiler: msvc
            build-type: Release
          - os: windows-2022
            compiler: msvc
            build-type: Debug
    
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/vcpkg
          ~/.cache/conan
          build/_deps
        key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}
        restore-keys: |
          ${{ matrix.os }}-${{ matrix.compiler }}-
          ${{ matrix.os }}-
          
    # Linux setup
    - name: Setup Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build \
          libeigen3-dev libboost-all-dev libtbb-dev \
          libhdf5-dev libfftw3-dev \
          python3-dev python3-pip \
          gfortran-12 \
          libgtest-dev libgmock-dev
          
    - name: Setup Linux compiler (GCC)
      if: runner.os == 'Linux' && matrix.compiler == 'gcc'
      run: |
        echo "CC=gcc-12" >> $GITHUB_ENV
        echo "CXX=g++-12" >> $GITHUB_ENV
        echo "FC=gfortran-12" >> $GITHUB_ENV
        
    - name: Setup Linux compiler (Clang)
      if: runner.os == 'Linux' && matrix.compiler == 'clang'
      run: |
        sudo apt-get install -y clang-14
        echo "CC=clang-14" >> $GITHUB_ENV
        echo "CXX=clang++-14" >> $GITHUB_ENV
        echo "FC=gfortran-12" >> $GITHUB_ENV
        
    # macOS setup
    - name: Setup macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake ninja eigen boost tbb hdf5 fftw
        brew install gcc@12
        
    - name: Setup macOS compiler (GCC)
      if: runner.os == 'macOS' && matrix.compiler == 'gcc'
      run: |
        echo "CC=gcc-12" >> $GITHUB_ENV
        echo "CXX=g++-12" >> $GITHUB_ENV
        echo "FC=gfortran-12" >> $GITHUB_ENV
        
    - name: Setup macOS compiler (Clang)
      if: runner.os == 'macOS' && matrix.compiler == 'clang'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "FC=gfortran-12" >> $GITHUB_ENV
        
    # Windows setup
    - name: Setup Windows dependencies
      if: runner.os == 'Windows'
      run: |
        vcpkg install eigen3 boost-all tbb hdf5 fftw3 gtest
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib astropy pandas pybind11
        
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DBUILD_TESTS=ON \
          -DBUILD_BENCHMARKS=ON \
          -DBUILD_PYTHON_BINDINGS=ON \
          -DENABLE_SIMD=ON \
          -DENABLE_PROFILING=OFF \
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
          
    - name: Build M17 Framework
      run: |
        cmake --build build --config ${{ matrix.build-type }} --parallel
        
    - name: Build Rust components
      working-directory: src/rust
      run: |
        cargo build --release
        
    - name: Run C++ tests
      working-directory: build
      run: |
        ctest --output-on-failure --parallel --build-config ${{ matrix.build-type }}
        
    - name: Run Python tests
      run: |
        cd src/python
        python setup.py build_ext --inplace
        python -m pytest tests/ -v
        
    - name: Run Rust tests
      working-directory: src/rust
      run: |
        cargo test --release
        
    - name: Generate coverage report (Linux only)
      if: runner.os == 'Linux' && matrix.compiler == 'gcc' && matrix.build-type == 'Debug'
      run: |
        sudo apt-get install -y lcov
        lcov --capture --directory build --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/external/*' --output-file coverage_filtered.info
        
    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && matrix.compiler == 'gcc' && matrix.build-type == 'Debug'
      uses: codecov/codecov-action@v3
      with:
        file: coverage_filtered.info
        flags: unittests
        name: M17-${{ matrix.os }}-${{ matrix.compiler }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: m17-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build-type }}
        path: |
          build/src/m17_core*
          build/src/m17_benchmark*
          build/src/m17_validate*
          src/rust/target/release/m17-rust*
          src/python/dist/*.whl

  # ==========================================================================
  # Performance Benchmarks
  # ==========================================================================
  
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    needs: [code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up high-performance build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build \
          libeigen3-dev libboost-all-dev libtbb-dev \
          python3-dev python3-pip gfortran-12 \
          linux-tools-common linux-tools-generic
          
    - name: Configure for performance
      run: |
        cmake -B build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-O3 -march=native -mtune=native" \
          -DBUILD_BENCHMARKS=ON \
          -DENABLE_SIMD=ON \
          -DENABLE_PROFILING=ON
          
    - name: Build framework
      run: |
        ninja -C build -j$(nproc)
        
    - name: Run performance benchmarks
      run: |
        cd build
        ./m17_benchmark --iterations 100000 --verbose > benchmark_results.txt
        
    - name: Parse benchmark results
      run: |
        python3 -c "
        import json, re
        
        results = {}
        with open('build/benchmark_results.txt', 'r') as f:
            content = f.read()
            
        # Extract performance metrics
        ops_match = re.search(r'Uncertainty propagation: (\d+\.?\d*) ops/sec', content)
        if ops_match:
            results['uncertainty_ops_per_sec'] = float(ops_match.group(1))
            
        physics_match = re.search(r'Physics computation: (\d+\.?\d*) ops/sec', content)
        if physics_match:
            results['physics_ops_per_sec'] = float(physics_match.group(1))
            
        with open('performance_metrics.json', 'w') as f:
            json.dump(results, f, indent=2)
        "
        
    - name: Performance regression check
      run: |
        python3 -c "
        import json, sys
        
        # Performance thresholds
        THRESHOLDS = {
            'uncertainty_ops_per_sec': 10000,
            'physics_ops_per_sec': 1000
        }
        
        with open('performance_metrics.json', 'r') as f:
            metrics = json.load(f)
            
        failed = False
        for metric, threshold in THRESHOLDS.items():
            if metric in metrics:
                if metrics[metric] < threshold:
                    print(f'FAIL: {metric} = {metrics[metric]}, below threshold {threshold}')
                    failed = True
                else:
                    print(f'PASS: {metric} = {metrics[metric]}, above threshold {threshold}')
            else:
                print(f'WARN: {metric} not found in results')
                
        if failed:
            sys.exit(1)
        "
        
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-benchmarks
        path: |
          build/benchmark_results.txt
          performance_metrics.json

  # ==========================================================================
  # Docker Build and Push
  # ==========================================================================
  
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-22.04
    needs: [build-matrix]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push runtime image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: runtime
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        
    - name: Build and push development image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: development
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:dev-${{ github.sha }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:dev-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        
    - name: Build and push benchmark image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: benchmark
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:benchmark-${{ github.sha }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:benchmark-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # ==========================================================================
  # Documentation Generation and Deployment
  # ==========================================================================
  
  documentation:
    name: Build and Deploy Documentation
    runs-on: ubuntu-22.04
    needs: [code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install documentation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz pandoc texlive-latex-base
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser sphinx-autoapi
        
    - name: Generate C++ documentation
      run: |
        doxygen docs/Doxyfile
        
    - name: Build Python documentation
      run: |
        cd docs
        make html
        
    - name: Convert LaTeX paper to PDF
      run: |
        cd docs/paper
        pdflatex main.tex
        bibtex main
        pdflatex main.tex
        pdflatex main.tex
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          docs/_build/
          docs/paper/main.pdf

  # ==========================================================================
  # Release Management
  # ==========================================================================
  
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build-matrix, docker, benchmarks]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog since last tag
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create release package
      run: |
        mkdir -p release
        
        # Copy binaries
        find . -name "m17-*" -type d -exec cp -r {} release/ \;
        
        # Copy documentation
        cp -r documentation/docs/_build/html release/documentation/
        cp documentation/docs/paper/main.pdf release/M17_Framework_Paper.pdf
        
        # Copy performance results
        cp performance-benchmarks/* release/
        
        # Create archive
        tar -czf m17-framework-${{ github.ref_name }}-linux.tar.gz -C release .
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: M17 Framework ${{ github.ref_name }}
        body: |
          ## ChiragRathi M17 Framework ${{ github.ref_name }}
          
          ### Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ### Assets
          - **m17-framework-${{ github.ref_name }}-linux.tar.gz**: Complete Linux distribution
          - **M17_Framework_Paper.pdf**: Academic research paper
          - **performance_metrics.json**: Performance benchmark results
          
          ### Docker Images
          ```bash
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          ```
          
          ### Quick Start
          ```bash
          # Extract release
          tar -xzf m17-framework-${{ github.ref_name }}-linux.tar.gz
          
          # Run framework
          ./m17_core --mode interactive
          ```
          
        files: |
          m17-framework-${{ github.ref_name }}-linux.tar.gz
          release/M17_Framework_Paper.pdf
          release/performance_metrics.json
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  
  security:
    name: Security Scanning
    runs-on: ubuntu-22.04
    needs: [docker]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: cpp, python

  # ==========================================================================
  # Notification and Reporting
  # ==========================================================================
  
  notify:
    name: Notification
    runs-on: ubuntu-22.04
    needs: [build-matrix, docker, benchmarks, documentation]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.build-matrix.result == 'success' && needs.docker.result == 'success'
      run: |
        echo "✅ M17 Framework CI/CD completed successfully!"
        echo "All builds passed, Docker images pushed, documentation updated."
        
    - name: Notify on failure
      if: needs.build-matrix.result == 'failure' || needs.docker.result == 'failure'
      run: |
        echo "❌ M17 Framework CI/CD failed!"
        echo "Check the failed jobs for details."
        exit 1
