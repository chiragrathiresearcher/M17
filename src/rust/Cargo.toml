[package]
name = "m17-rust"
version = "2.0.0"
edition = "2021"
authors = ["Chirag Rathi"]
description = "High-performance Rust components for M17 ChiragRathi framework"
license = "MIT"
repository = "https://github.com/chiragrathiresearcher/m17-framework"
keywords = ["astronomy", "parallel", "uncertainty", "physics"]
categories = ["science", "concurrency", "algorithms"]

[features]
default = ["parallel", "simd"]
parallel = ["rayon", "crossbeam"]
simd = ["wide"]
gpu = ["cudarc", "candle-core"]
benchmarks = ["criterion"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Mathematical and scientific computing
nalgebra = { version = "0.33", features = ["serde-serialize"] }
ndarray = { version = "0.16", features = ["rayon", "serde"] }
num-traits = "0.2"
num-complex = "0.4"
approx = "0.5"

# Parallel and concurrent processing
rayon = { version = "1.8", optional = true }
crossbeam = { version = "0.8", optional = true }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# SIMD optimization
wide = { version = "0.7", optional = true, features = ["std"] }

# GPU acceleration (optional)
cudarc = { version = "0.12", optional = true }
candle-core = { version = "0.6", optional = true }

# Data formats and I/O
bincode = "1.3"
rmp-serde = "1.1"  # MessagePack
csv = "1.3"
hdf5 = "0.8"

# Networking and protocols
tonic = "0.12"
prost = "0.13"
tower = "0.4"

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Memory management
parking_lot = "0.12"

[dev-dependencies]
criterion = { version = "0.5", optional = true }
proptest = "1.4"
tempfile = "3.8"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "m17-data-processor"
path = "src/bin/data_processor.rs"

[[bin]]
name = "m17-stream-server"
path = "src/bin/stream_server.rs"

[[bench]]
name = "uncertainty_bench"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "parallel_bench"
harness = false
required-features = ["benchmarks"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
